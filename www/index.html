<style>
:root{--bg:#fbf8f1;--fg:#1d2433;--mu:#6a7080;--card:#fff;--bd:#e4dfd2;--ac:#e7a400;--ink:#1d2a44;--ok:#1b8f58;--hl:#fff4cf;--bad:#d33;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#12151d;--fg:#eceff6;--mu:#9aa1b3;--card:#1b2030;--bd:#2c3348;--ac:#f2b61f;--ink:#dfe6fa;--ok:#4cc58a;--hl:#3a3216;--bad:#ff7b7b}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
#app{max-width:760px;margin:0 auto;padding:18px 16px 80px}
h1{font:800 26px/1.2 system-ui,sans-serif;margin:6px 0 4px;color:var(--ink)}
h2{font-size:18px;margin:0 0 6px;color:var(--ink)}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:10px 0}
.store-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch}.store-grid .card{margin:0;display:flex;flex-direction:column;min-width:0}.store-grid .card .row:last-child{margin-top:auto;padding-top:12px}.store-grid h2{overflow-wrap:anywhere}.store-empty{grid-column:1/-1;text-align:center;padding:28px 14px;border:1px dashed var(--bd);border-radius:12px;color:var(--mu)}
@media(max-width:520px){.store-grid{grid-template-columns:1fr}}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
.pri{background:var(--ac);border-color:var(--ac);color:#1d1d1d;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.tabs button{white-space:nowrap}.tabs .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.tabs .dn{border-color:var(--ok)}
.step{border:1px solid var(--bd);border-radius:10px;margin:10px 0;background:var(--card)}
.step.act{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.sh{display:flex;gap:10px;padding:12px;cursor:pointer;align-items:flex-start}
.sh input{width:22px;height:22px;margin-top:2px;accent-color:var(--ok)}
.cnt{font-weight:700;color:var(--ink);white-space:nowrap}
.sb{padding:0 12px 12px}
audio{width:100%;margin:8px 0}
.slot{border-top:1px solid var(--bd);padding:12px 0}.slot:first-of-type{border-top:0}
.ok{color:var(--ok);font-weight:600}.rest{text-align:center;padding:30px 10px}
.car-b{animation:cbob .45s ease-in-out infinite alternate}@keyframes cbob{to{transform:translateY(-1.3px)}}@media (prefers-reduced-motion:reduce){.car-b{animation:none}}
.rm-n.rs{pointer-events:none;cursor:default;width:22%;filter:grayscale(.5);border-style:dashed}
.rm-n.rs.lit{filter:none;opacity:1;border-style:solid;box-shadow:0 0 22px 6px rgba(255,201,40,.6),0 5px 0 #b8861a;animation:rsglow 2.2s ease-in-out infinite}
@keyframes rsglow{50%{box-shadow:0 0 0 8px rgba(255,201,40,.3),0 0 34px 10px rgba(255,201,40,.8),0 5px 0 #b8861a}}
@media (prefers-reduced-motion:reduce){.rm-n.rs.lit{animation:none}}
.sn{display:flex;gap:6px;align-items:flex-start;padding:8px;border-bottom:1px solid var(--bd);border-radius:8px}.sn.cur{background:var(--hl)}.sbody{flex:1;cursor:pointer}
.sn.ansh .en-t,.sn.ansh .vi-t{opacity:0}
.sn.ansh.hn .en-t{opacity:1}.sn.ansh.hn .w{opacity:0}.sn.ansh.hn .w.k{opacity:1}
.sn .fx{padding:4px 8px;font-size:13px;opacity:.7}
.res{font-size:14px;margin-top:4px}.okw{color:var(--ok);font-weight:600}.bad2{color:var(--bad);text-decoration:underline wavy}
.rec{animation:pl 1s infinite;background:#fde0e0}@keyframes pl{50%{transform:scale(1.2)}}@media (prefers-reduced-motion:reduce){.rec{animation:none}}
#sub{position:sticky;top:calc(42px + var(--th,0px));z-index:3;background:var(--hl);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;min-height:84px}
.subt{font-size:22px;font-weight:600;line-height:1.35}
.hen .en-t{filter:blur(9px)}.hvi .vi-t{filter:blur(7px)}
.hen .en-t:hover,.hen .en-t:active,.hvi .vi-t:hover,.hvi .vi-t:active{filter:none}
.tg{padding:3px 10px;font-size:13px}.tg.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:92vw;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:10;display:none;font-size:14px;white-space:pre-line}
select,input[type=text]{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px}
details{margin:8px 0}summary{cursor:pointer;color:var(--mu);font-size:14px}
#toast{z-index:30}
.new{border:2px dashed var(--ac)}
.mdl{position:fixed;inset:0;z-index:20;background:rgba(10,12,18,.55);display:flex;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 12px max(16px,env(safe-area-inset-bottom,0px))}
.mbox{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:16px;width:100%;max-width:640px;margin:auto 0}
.mbox h2{margin:0 0 8px}.mbox label{display:block}.mbox input[type=text],.mbox select{width:100%;margin-top:2px}
textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%;resize:vertical;line-height:1.45;margin:8px 0 0}
.mono{font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}.pv{font-size:14px;margin:6px 0 10px}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,select,summary,.sh,.sbody{touch-action:manipulation}
@media (max-width:640px){
#app{padding:12px 12px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:23px;margin:10px 0 4px}h2{font-size:17px}
button,select{min-height:46px;font-size:16px;padding:8px 12px}
input[type=text],textarea.mono,textarea{font-size:16px}
input[type=text]{min-height:46px}
.card{padding:12px;border-radius:14px;margin:12px 0}
.row{gap:8px}.row>button{flex:1 1 auto}.row>span.sp:empty{display:none}
.card.new .row>.pri{flex:0 0 auto;min-width:84px}
.tabs{gap:8px;padding:6px 0 10px;scroll-snap-type:x proximity}.tabs button{min-width:56px;scroll-snap-align:start}
.step{border-radius:14px}.sh{padding:12px 10px;gap:10px}.sh input{width:28px;height:28px;flex:none}
.sb{padding:0 10px 12px}
audio{height:48px;margin:10px 0}
.subt{font-size:20px}#sub{padding:10px;border-radius:12px}
.sn{padding:10px 6px;gap:8px}.sn button{min-width:46px;min-height:46px}.sn .fx{min-height:36px}
.tg{min-height:38px;padding:4px 12px}
.mdl{align-items:flex-end;padding:0}
.mbox{max-width:none;margin:0;border-radius:18px 18px 0 0;border-width:1px 0 0;max-height:92vh;max-height:92dvh;overflow-y:auto;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.mbox .row{position:sticky;bottom:calc(-1 * (16px + env(safe-area-inset-bottom,0px)));background:var(--card);padding:10px 0 4px;margin-top:6px}
#toast{width:calc(100% - 24px);text-align:center;bottom:calc(20px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:640px){
#app{padding:10px 10px calc(72px + env(safe-area-inset-bottom,0px))}
h1{font-size:19px;margin:8px 0 2px}h2{font-size:15px}
body{font-size:14px}
button,select{min-height:38px;font-size:14px;padding:5px 10px}
input[type=text]{min-height:38px}
input[type=text],textarea,textarea.mono{font-size:16px}
.card{padding:10px;border-radius:12px;margin:8px 0}
.row{gap:6px}
.sh{padding:9px 8px;gap:8px}.sh input{width:22px;height:22px}
.sb{padding:0 8px 8px}
audio{height:40px;margin:6px 0}
.subt{font-size:17px}#sub{padding:8px}
.sn{padding:7px 4px;gap:6px}.sn button{min-width:38px;min-height:38px}.sn .fx{min-height:30px}
.tg{min-height:32px;padding:3px 10px}
.tabs{gap:6px;padding:4px 0 8px}.tabs button{min-width:44px}
.mbox{padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.mbox h2{font-size:16px}
.mbox .row{bottom:calc(-1 * (12px + env(safe-area-inset-bottom,0px)))}
}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 0 4px;position:sticky;top:0;z-index:7;background:var(--bg)}
.brand{font-weight:700;font-size:15px;opacity:.75}
.ib{min-height:0!important;width:38px;height:38px;padding:0!important;display:inline-flex;align-items:center;justify-content:center;flex:none!important}

const AUD=/\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|webm)$/i;
function pickAudio(id){const i=document.createElement('input');i.type='file';i.multiple=true;i.accept='audio/*,.mp3,.m4a,.wav';
  i.onchange=()=>{if(i.files.length)importAudio([...i.files],id)};i.click()}
async function importAudio(files,id){
  const aud=files.filter(f=>AUD.test(f.name)),named=aud.filter(f=>{const m=f.name.match(/^\s*(\d{1,2})(?!\d)/);return m&&TK[+m[1]-1]});
  if(aud.length===1&&!named.length)return importCombined(aud[0],id);
  const l=lesson(id);let ok=0;const skipped=[];
  for(const f of files){
    const m=f.name.match(/^\s*(\d{1,2})(?!\d)/),t=m?TK[+m[1]-1]:undefined;
    if(!AUD.test(f.name)||!t)continue;
    try{await put(l.id+':'+t,f);l.has[t]=f.name;delete SG[l.id+':'+t];ok++}catch(err){skipped.push(f.name)}
  }
  persist();render();
  toast(ok?'Đã nạp '+ok+' file audio ('+TK.filter(t=>l.has[t]).map(tn).join(', ')+').':'Không có file nào tên bắt đầu bằng 01, 02 hoặc 03. Hãy chọn 1 file gộp duy nhất (vd “00 - Full.mp3”) hoặc các file như “01 - Conversation.mp3”.',9000);
}

function wavBlob(f,sr){const n=f.length,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};

  for(let i=0;i<n;i++){const x=Math.max(-1,Math.min(1,f[i]));v.setInt16(44+i*2,x<0?x*32768:x*32767,true)}
  return new Blob([b],{type:'audio/wav'})}

  for(let i=0;i<m;i++){let q=0;for(let j=0;j<fr;j++){const v=x[i*fr+j];q+=v*v}r[i]=Math.sqrt(q/fr);if(r[i]>mx)mx=r[i]}

// rms: năng lượng mỗi khung 20ms; w: trọng số độ dài mỗi câu. Trả về [[bắt đầu,kết thúc],…] (giây) hoặc null.
function computeSegs(rms,hop,dur,w){
  const n=rms.length,N=w.length;if(!n||!N)return null;
  const so=Float32Array.from(rms).sort(),noise=so[Math.floor(n*.1)],peak=so[Math.min(n-1,Math.floor(n*.98))],th=Math.max(noise*2.5,peak*.04);
  let a=Array.from(rms,x=>x>=th);
  const runs=(val,fn)=>{let i=0;while(i<n){const v=a[i];let j=i;while(j<n&&a[j]==v)j++;if(v==val)fn(i,j);i=j}};
  runs(false,(i,j)=>{if(j-i<4&&i>0&&j<n)for(let k=i;k<j;k++)a[k]=true});
  runs(true,(i,j)=>{if(j-i<3)for(let k=i;k<j;k++)a[k]=false});
  const f0=a.indexOf(true),f1=a.lastIndexOf(true);if(f0<0)return null;
  const ca=new Float64Array(n+1);for(let i=0;i<n;i++)ca[i+1]=ca[i]+(a[i]&&i>=f0&&i<=f1?1:0);
  const total=ca[n]*hop,t0=Math.max(0,f0*hop-.05),t1=Math.min(dur,(f1+1)*hop+.1);
  if(N==1)return{segs:[[t0,t1]],conf:1};
  const K=N-1,tw=w.reduce((x,y)=>x+y,0),rate=total/tw;
  // các khoảng lặng ứng viên (ưu tiên khoảng lặng dài; hạ ngưỡng nếu không đủ)
  let C=[];
  for(const minF of [6,3]){C=[];runs(false,(i,j)=>{if(i>f0&&j<=f1&&j-i>=minF)C.push({s:i*hop,e:j*hop,len:(j-i)*hop,cs:ca[i]*hop})});if(C.length>=K)break}
  if(C.length<K){ // thiếu khoảng lặng: chia theo tỉ lệ độ dài câu
    let c=0;return{segs:w.map(x=>{const s=t0+c/tw*(t1-t0);c+=x;return[s,t0+c/tw*(t1-t0)]}),conf:0}}
  const M=C.length,INF=1e18,MIN=.25,SIG=.55;
  const pc=j=>-2.4*Math.min(C[j].len,1);                      // thưởng khoảng lặng dài
  const sc=(k,d)=>{const e=Math.log(Math.max(d,.05)/(w[k]*rate))/SIG;return Math.min(e*e,9)}; // độ dài câu phải tương ứng độ dài chữ
  // dp[j] = chi phí tốt nhất khi ranh giới thứ k đặt ở khoảng lặng j
  let prev=new Float64Array(M),bp=[null];
  for(let j=0;j<M;j++)prev[j]=sc(0,C[j].cs)+pc(j);
  for(let k=1;k<K;k++){
    const cur=new Float64Array(M).fill(INF),b=new Int32Array(M).fill(-1);
    for(let j=k;j<M;j++){let best=INF,bi=-1;
      for(let i=k-1;i<j;i++){if(prev[i]>=INF)continue;const d=C[j].cs-C[i].cs;if(d<MIN&&C[j].s-C[i].e<MIN)continue;
        const v=prev[i]+sc(k,d);if(v<best){best=v;bi=i}}
      if(bi>=0){cur[j]=best+pc(j);b[j]=bi}}
    prev=cur;bp.push(b)}
  let j=-1,best=INF;for(let x=0;x<M;x++){if(prev[x]>=INF)continue;const v=prev[x]+sc(K,total-C[x].cs);if(v<best){best=v;j=x}}
  if(j<0)return null;
  const ch=new Array(K);for(let k=K-1;k>=0;k--){ch[k]=j;if(k>0)j=bp[k][j]}
  const segs=[];let st=t0;
  for(let k=0;k<K;k++){const c=C[ch[k]];segs.push([st,Math.max(Math.min(c.s+.08,c.e),st+.1)]);st=Math.max(c.e-.08,c.s)}
  segs.push([st,t1]);
  // độ tin cậy: tỉ lệ khoảng lặng được chọn dài hơn 0.25s
  let strong=0;for(let k=0;k<K;k++)if(C[ch[k]].len>=.25)strong++;
  return{segs,conf:strong/K};
}
async function segsFor(l,t,dur,sen){
  const key=l.id+':'+t,sig=key+':'+Math.round(dur*10)+':'+sen.map(x=>x.en.length).join(',');
  if(SG[key]&&SG[key].sig==sig)return SG[key];
  const w=sen.map(x=>x.en.replace(/[^A-Za-z0-9']/g,'').length+3),N=sen.length,tot=w.reduce((x,y)=>x+y,0);
  let c=0,res={sig,segs:w.map(x=>{const s=c;c+=x/tot*dur;return[s,c]}),conf:0,auto:false};
  try{
    const b=await get(key),ac=new(window.AudioContext||window.webkitAudioContext)(),au=await ac.decodeAudioData(await b.arrayBuffer());ac.close();
    const ch=au.getChannelData(0),fr=Math.max(1,Math.floor(au.sampleRate*.02)),n=Math.floor(ch.length/fr),r=new Float32Array(n);
    for(let i=0;i<n;i++){let q=0;for(let j=0;j<fr;j++){const x=ch[i*fr+j];q+=x*x}r[i]=Math.sqrt(q/fr)}
    ENV[key]={r,hop:fr/au.sampleRate};const o=computeSegs(r,fr/au.sampleRate,au.duration,w);if(o){res={sig,segs:o.segs,conf:o.conf,auto:true}}
  }catch(e){}
  const fx=FIX[key]||{};
  Object.keys(fx).sort((x,y)=>x-y).forEach(i=>{i=+i;if(!res.segs[i])return;const tt=fx[i];res.segs[i][0]=tt;
    if(i>0&&res.segs[i-1][1]>tt-.05)res.segs[i-1][1]=Math.max(res.segs[i-1][0]+.1,tt-.05);
    if(res.segs[i][1]<=tt+.2)res.segs[i][1]=res.segs[i+1]?Math.max(tt+.3,res.segs[i+1][0]):tt+.5});
  const aj=ADJ[key]||{};
  Object.keys(aj).forEach(i=>{i=+i;const g=res.segs[i];if(!g)return;const[ds,de]=aj[i];g[0]=Math.max(0,g[0]+ds);g[1]=Math.min(dur,Math.max(g[0]+.15,g[1]+de))});
  return SG[key]=res;
}

function segmentStep(t){for(let d=0;d<PLAN.length;d++){const a=PLAN[d].findIndex(x=>x.t==t);if(a>=0)return{day:d,a}}return null}
const ENV={};

function segB(){return V.segs&&V.segs[V.sel]}
function segKey(){return V.id+':'+PLAN[V.day][V.a].t}
function segSnap(){V.undo=V.undo||[];V.undo.push(JSON.stringify([V.segs,ADJ[segKey()]||null]));if(V.undo.length>60)V.undo.shift()}
function segUndo(){const u=V.undo&&V.undo.pop();if(!u){toast('Chưa có thao tác nào để hoàn tác.',2000);return}
  const[sg,aj]=JSON.parse(u),k=segKey();sg.forEach((g,i)=>{V.segs[i][0]=g[0];V.segs[i][1]=g[1]});
  if(aj)ADJ[k]=aj;else delete ADJ[k];sv('el2_adj',ADJ);segUI();prevS(V.sel)}

function segStep(v){V.step=v;segUI()}
function segToggleLoop(){V.segLoop=V.segLoop===false;if(V.segLoop===false)V.edI=null;else V.edI=V.sel;segUI()}
function segSel(i,p){if(!V.segs||!V.segs[i])return;V.sel=i;if(p)prevS(i);else segUI()}
function segGo(d){const n=(V.sel||0)+d;if(V.segs&&V.segs[n])segSel(n,true)}

function segHere(w){const au=document.getElementById('au'),g=segB();if(!au||!g)return;const o=g[w];segSnap();adj(V.sel,w,Math.round((au.currentTime-g[w])*100)/100,true);
  if(g[w]==o){V.undo.pop();toast('Vị trí này làm câu quá ngắn (dưới 0,15s). Hãy phát tới đúng chỗ cần cắt rồi bấm lại.',3500);return}
  toast((w?'Cuối':'Đầu')+' câu '+(V.sel+1)+' = '+g[w].toFixed(2)+'s',1800);segUI();prevS(V.sel)}
function segUI(){const g=segB();if(!g)return;const sg=V.segs,i=V.sel;
  const x=sents(lesson(V.id),PLAN[V.day][V.a].t)[i],sb=document.getElementById('segsub');if(sb&&x)sb.innerHTML=`<div class="subt en-t">${esc(x.en)}</div>${x.vi?`<div class="mu vi-t" style="margin-top:4px">${esc(x.vi)}</div>`:''}`;
  const f=(id,t)=>{const e=document.getElementById(id);if(e)e.textContent=t};
  f('segA',g[0].toFixed(2)+'s');f('segB',g[1].toFixed(2)+'s');f('segno',(i+1)+'/'+sg.length);
  const lp=document.getElementById('seglp');if(lp)lp.textContent=V.segLoop===false?'🔁 Lặp: Tắt':'🔁 Lặp: Bật';
  const un=document.getElementById('segun');if(un)un.disabled=!(V.undo&&V.undo.length);

  document.querySelectorAll('.spg button').forEach(b=>b.classList.toggle('on',+b.dataset.v==(V.segSp||1)));
  document.querySelectorAll('.stp button').forEach(b=>b.classList.toggle('on',+b.dataset.v==(V.step||.1)));
  document.querySelectorAll('#segmentSentenceList .sn').forEach((e,k)=>{e.classList.toggle('segsel',k==i);const t=document.getElementById('st'+k);if(t&&sg[k])t.textContent=sg[k][0].toFixed(1)+'–'+sg[k][1].toFixed(1)+'s'});
  const el=document.getElementById('sn'+i);if(el)el.scrollIntoView({block:'nearest'});segDraw()}
function segView(){if(V.segFreeze)return V.segFreeze;const g=segB(),au=document.getElementById('au'),d=au&&au.duration||V.segs[V.segs.length-1][1],pad=Math.max(1.2,(g[1]-g[0])*.4);return[Math.max(0,g[0]-pad),Math.min(d,g[1]+pad)]}
function segDraw(){const cv=document.getElementById('segcv'),g=segB();if(!cv||!g)return;
  const dp=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(cv.width!=W*dp||cv.height!=H*dp){cv.width=W*dp;cv.height=H*dp}
  const c=cv.getContext('2d'),css=getComputedStyle(document.documentElement),col=n=>css.getPropertyValue(n).trim(),[t0,t1]=segView(),X=t=>(t-t0)/(t1-t0)*W,sg=V.segs;
  c.setTransform(dp,0,0,dp,0,0);c.clearRect(0,0,W,H);
  c.fillStyle=col('--hl');c.fillRect(X(g[0]),0,X(g[1])-X(g[0]),H);
  const E=ENV[segKey()];c.fillStyle=col('--mu');
  if(E){const m=Math.max(.001,...E.r.slice(Math.floor(t0/E.hop),Math.ceil(t1/E.hop)));for(let x=0;x<W;x+=2){const a=Math.floor((t0+(x/W)*(t1-t0))/E.hop),b=Math.max(a+1,Math.floor((t0+((x+2)/W)*(t1-t0))/E.hop));let q=0;for(let k=a;k<b;k++)q=Math.max(q,E.r[k]||0);const h=Math.max(1,Math.sqrt(q/m)*(H-26));c.fillRect(x,(H-h)/2+6,1.6,h)}}
  else{c.fillText('Không có sóng âm — dùng nút ± hoặc “= đang phát”',8,H/2)}
  c.font='700 12px system-ui';c.fillStyle=col('--ink');
  sg.forEach((q,k)=>{const x0=X(q[0]),x1=X(q[1]);if(x1<0||x0>W)return;c.globalAlpha=.55;c.fillRect(Math.round(x0),0,1,H);c.globalAlpha=1;c.fillText(k+1,Math.max(2,Math.min(W-14,(x0+x1)/2-4)),12)});
  c.strokeStyle=col('--ac');c.fillStyle=col('--ac');c.lineWidth=3;
  [g[0],g[1]].forEach((t,k)=>{const x=X(t);c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();c.beginPath();c.arc(x,H-12,8,0,7);c.fill()});
  const au=document.getElementById('au');if(au){const x=X(au.currentTime);c.strokeStyle=col('--bad');c.lineWidth=2;c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}}
function segLoop(){cancelAnimationFrame(segLoop.h);if(!V.segEd||!document.getElementById('segcv'))return;segDraw();segLoop.h=requestAnimationFrame(segLoop)}
function segBind(){const cv=document.getElementById('segcv');if(!cv||cv._b)return;cv._b=1;let dr=null,dx0=0,dv0=0,dsp=1,SLOW=3;
  const T=e=>{const r=cv.getBoundingClientRect(),[a,b]=segView();return a+(e.clientX-r.left)/r.width*(b-a)};
  cv.onpointerdown=e=>{const g=segB(),r=cv.getBoundingClientRect(),[a,b]=segView(),px=t=>(t-a)/(b-a)*r.width,x=e.clientX-r.left,d0=Math.abs(x-px(g[0])),d1=Math.abs(x-px(g[1]));
    if(Math.min(d0,d1)<22){dr=d0<=d1?0:1;dx0=e.clientX;dv0=g[dr];V.segFreeze=segView();dsp=V.segFreeze[1]-V.segFreeze[0];segSnap();window.NOSV=true;cv.setPointerCapture(e.pointerId);const au=document.getElementById('au');if(au)au.pause();return}
    const t=T(e),k=V.segs.findIndex(q=>t>=q[0]&&t<q[1]);if(k>=0&&k!=V.sel)segSel(k,true);else{const au=document.getElementById('au');au.currentTime=t;au.play()}};
  cv.onpointermove=e=>{if(dr==null)return;const g=segB(),r=cv.getBoundingClientRect(),tg=dv0+(e.clientX-dx0)/r.width*dsp/SLOW;adj(V.sel,dr,Math.round((tg-g[dr])*100)/100,true)};
  const up=()=>{if(dr==null)return;dr=null;V.segFreeze=null;window.NOSV=false;sv('el2_adj',ADJ);segPlay()};cv.onpointerup=up;cv.onpointercancel=up}

  delete FIX[k];delete ADJ[k];delete SG[k];V.undo=[];sv('el2_fix',FIX);sv('el2_adj',ADJ);initAudio();toast('Đã khôi phục căn câu tự động.')}


// ================= nạp script =================
// Mỗi dòng 1 câu: "English | Tiếng Việt" (bản dịch có thể bỏ). Dòng "### 01+02" bắt đầu script của (các) bài tương ứng.
function parseScript(text,defT){
  const H=/^\s*(?:#{1,6}\s*|\[\s*|={2,}\s*|(?:bài|track)\s+)(?:bài\s*|track\s*)?(0?[1-5](?:\s*[+,&\/]\s*0?[1-5])*)(?!\d).*$/i;
  const map={};let cur=[+defT];
  for(const raw of String(text||'').replace(/\r/g,'').split('\n')){
    let ln=raw.replace(/\*\*/g,'').replace(/^\s*```.*$/,'').trim();
    if(!ln)continue;
    if(/^#{1,6}\s*(?:vocab|từ vựng|tu vung)\b/i.test(ln)){cur=[];continue}
    const m=ln.match(H);
    if(m){const ns=m[1].split(/[+,&\/]/).map(x=>+x.trim()),old=ns.length>1||ns.some(x=>x>3);cur=[...new Set(ns.map(x=>old?CAN[x]:TK[x-1]).filter(Boolean))];continue}
    ln=ln.replace(/^(?:[-*•]\s+|\d+[.)]\s+)/,'').trim();
    const p=ln.split(/\s*[|\t]\s*/),en=(p[0]||'').trim(),vi=p.slice(1).join(' ').trim();
    if(!en)continue;
    cur.forEach(t=>{(map[t]=map[t]||[]).push({en,vi})})}
  Object.keys(map).forEach(t=>{if(!map[t].length)delete map[t]});
  return map}
// Khối "### VOCAB": 8–12 dòng "từ hoặc cấu trúc | nghĩa", dùng để nối các lesson với nhau (không tính là câu luyện).
function parseVocab(text){const out=[];let on=false;
  for(const raw of String(text||'').replace(/\r/g,'').split('\n')){
    const ln=raw.replace(/\*\*/g,'').replace(/^\s*```.*$/,'').trim();if(!ln)continue;
    if(/^#{1,6}\s*(?:vocab|từ vựng|tu vung)\b/i.test(ln)){on=true;continue}
    if(on&&/^(?:#{1,6}\s*|={2,}\s*)/.test(ln)){on=false;continue}
    if(!on)continue;
    const t=ln.replace(/^(?:[-*•]\s+|\d+[.)]\s+)/,'').trim(),p=t.split(/\s*[|\t]\s*/),w=(p[0]||'').trim();
    if(w)out.push({w,vi:p.slice(1).join(' ').trim()})}
  return out.slice(0,14)}
let SD={id:0,t:1,pre:''};
const fmtScript=(l,t)=>(l.s[t]||[]).map(x=>x.en+(x.vi?' | '+x.vi:'')).join('\n');
function clearTrack(l,t){const key=l.id+':'+t;delete SG[key];delete FIX[key];delete ADJ[key];sv('el2_adj',ADJ);
  [SC,AN].forEach(o=>Object.keys(o).forEach(k=>{if(k.startsWith(key+':'))delete o[k]}));
  sv('el2_fix',FIX);sv('el2_sc',SC);sv('el2_ans',AN)}
function openScript(id,t){const l=lesson(id);SD={id,t:t||1,pre:''};
  modal(`<h2>Nạp script – ${esc(l.name)}</h2>
  <p class="mu">Mỗi dòng 1 câu, đúng thứ tự trong audio. Có bản dịch thì viết <b>English | Tiếng Việt</b>. Có thể dán script của cả 3 phần cùng lúc, mỗi phần mở đầu bằng dòng <span class="mono">### 01</span> (hội thoại), <span class="mono">### 02</span> (câu chuyện), <span class="mono">### 03</span> (hỏi đáp) (script AI soạn theo câu lệnh ở mục “Thêm lesson mới” đã đúng dạng này).</p>
  <label class="mu">Áp cho phần (khi không có dòng ###) <select id="sdT" onchange="sdSel(this.value)">${TK.map((t,i)=>`<option value="${t}" ${SD.t==t?'selected':''}>0${i+1} · ${NAME3[i]}</option>`).join('')}</select></label>
  <textarea id="sdX" rows="12" class="mono" oninput="sdPv()" placeholder="Please, let me introduce myself. | Tôi xin phép được tự giới thiệu.&#10;I'm Jane. Great to meet you. | Tôi là Jane. Rất vui được gặp anh."></textarea>
  <div class="pv" id="sdPv"></div>
  <div class="row"><button onclick="sdPaste()">Dán từ clipboard</button><button onclick="sdFile()">Chọn file .txt</button><button onclick="sdDel()">Xóa script phần đã chọn</button><span class="sp"></span><button onclick="closeModal()">Hủy</button><button class="pri" onclick="sdSave()">Lưu script</button></div>`);
  sdSel(SD.t)}
function sdSel(v){const x=document.getElementById('sdX');if(!x)return;SD.t=+v;const f=fmtScript(lesson(SD.id),SD.t);
  if(x.value===''||x.value===SD.pre){x.value=f;SD.pre=f}sdPv()}
function sdPv(){const x=document.getElementById('sdX'),p=document.getElementById('sdPv');if(!x||!p)return;
  const m=parseScript(x.value,SD.t),ks=Object.keys(m).sort();
  p.innerHTML=ks.length?'Sẽ lưu: '+ks.map(k=>'<b>'+tn(k)+'</b> ('+m[k].length+' câu)').join(', ')+(parseVocab(x.value).length?', <b>Từ vựng</b> ('+parseVocab(x.value).length+' mục)':''):'<span class="bad2">Chưa có câu nào.</span>'}
async function sdPaste(){try{const t=await navigator.clipboard.readText(),x=document.getElementById('sdX');if(x&&t){x.value=t;sdPv()}else toast('Clipboard đang trống.')}catch(e){toast('Trình duyệt không cho đọc clipboard: hãy bấm vào khung rồi dán (Ctrl+V).')}}
function sdFile(){const i=document.createElement('input');i.type='file';i.accept='.txt,.md,.csv,text/plain';
  i.onchange=async()=>{const f=i.files[0];if(!f)return;const x=document.getElementById('sdX');if(x){x.value=await f.text();sdPv()}};i.click()}
function sdSave(){const l=lesson(SD.id),x=document.getElementById('sdX');if(!l||!x)return;
  const m=parseScript(x.value,SD.t),ks=Object.keys(m).sort();
  if(!ks.length){toast('Chưa có câu nào để lưu. Muốn bỏ script thì bấm “Xóa script phần đã chọn”.');return}
  ks.forEach(t=>{l.ov[t]=m[t].map(a=>({en:a.en,vi:a.vi}));l.s[t]=l.ov[t].map(a=>({en:a.en,vi:a.vi}));clearTrack(l,t)});
  const vc=parseVocab(x.value);if(vc.length)l.voc=vc;
  persist();closeModal();render();
  toast('Đã lưu script: '+ks.map(k=>tn(k)+' ('+m[k].length+' câu)').join(', ')+(vc.length?', '+vc.length+' mục từ vựng':'')+'.')}
function sdDel(){const l=lesson(SD.id),t=SD.t;if(!l)return;
  if(!l.custom&&!(l.ov||{})[t]){toast('Phần này đang dùng script gốc của giáo trình.');return}
  if(!confirm(l.custom?'Xóa script phần '+tn(t)+'?':'Khôi phục script gốc cho phần '+tn(t)+'?'))return;
  delete l.ov[t];const b=DATA.find(d=>d.id==l.id);
  if(!l.custom&&b&&b.s&&b.s[t])l.s[t]=b.s[t];else delete l.s[t];
  clearTrack(l,t);persist();closeModal();render();toast(l.custom?'Đã xóa script phần '+tn(t)+'.':'Đã khôi phục script gốc phần '+tn(t)+'.')}

// ================= tạo bộ giáo trình mới =================
// ---- lộ trình độ khó (từ trình độ → đến trình độ, nội suy theo vị trí lesson) ----
const LVL=['A1','A2','B1','B2','C1'];
const LVG=['câu đơn rất ngắn, chủ yếu thì hiện tại, từ vựng sinh hoạt hằng ngày',
'câu đơn và câu ghép đơn giản, bắt đầu dùng quá khứ và tương lai, từ vựng sinh hoạt quen thuộc',
'câu phức đơn giản (mệnh đề quan hệ, điều kiện cơ bản, so sánh), kể chuyện và nêu ý kiến, vài cụm cố định thông dụng',
'câu phức đa dạng (bị động, điều kiện, liên từ nối ý), thành ngữ thông dụng, từ vựng trừu tượng cơ bản',
'câu dài nhiều mệnh đề, cấu trúc nâng cao, thành ngữ và cách kết hợp từ tự nhiên, sắc thái và hàm ý'];
const LVS=[5,7,10,13,17];
let PL=ld('el2_plan',{});
function plGet(sid){const p=PL[sid]||{},cnt=L.filter(x=>x.set==sid).length;return{a:p.a==null?2:p.a,b:p.b==null?3:p.b,n:p.n||Math.max(12,cnt+1)}}
function lvAt(p,pos){const n=Math.max(2,p.n),k=Math.min(Math.max(pos,1),n),x=p.a+(p.b-p.a)*(k-1)/(n-1),
  i=Math.min(4,Math.floor(x+1e-9)),j=Math.min(4,i+1),f=i>=4?0:x-i,
  label=f<.25?LVL[i]:f<.75?LVL[i]+'+':'gần '+LVL[j];
  return{pa:p.a,pb:p.b,n,pos:k,x,label,w:Math.round(LVS[i]+(LVS[j]-LVS[i])*f),nn:Math.round(6+1.5*x),gram:LVG[i],nxt:f>=.5&&i<4?LVL[j]:''}}
function lvBlock(v){return `\n\nĐỘ KHÓ CỦA LESSON NÀY (rất quan trọng)\nĐây là lesson thứ ${v.pos}/${v.n} trong lộ trình từ ${LVL[v.pa]} đến ${LVL[v.pb]}${v.pos>1?', nên phải nhỉnh hơn các lesson trước một chút (tăng dần, không nhảy vọt)':''}.\n- Mức: ${v.label}.\n- Độ dài câu trung bình: tương đương khoảng ${v.w} từ tiếng Anh (câu ngắn nhất khoảng ${Math.max(3,v.w-4)} từ, câu dài nhất khoảng ${v.w+4} từ).\n- Ngữ pháp và từ vựng: ${v.gram}${v.nxt?'; bắt đầu chen vài cấu trúc của mức '+v.nxt:''}.\n- Từ vựng và cấu trúc mới: khoảng ${v.nn}–${v.nn+2} mục, vừa trên mức các lesson trước.`}
// ---- nối với các lesson trước (tối đa 3 lesson gần nhất trong cùng bộ) ----
function linkBlock(sid){
  const items=L.filter(x=>x.set==sid).slice(-3).reverse().map(l=>{
    const vc=(l.voc||[]).map(x=>x.w).filter(Boolean);
    if(vc.length)return{l,k:'từ vựng và cấu trúc trọng tâm',t:vc.join('; ')};
    const ss=((l.s||{})[TK[0]]||[]).slice(0,8).map(x=>x.en).filter(Boolean);
    return ss.length?{l,k:'câu mẫu trích từ hội thoại',t:ss.join(' / ')}:null}).filter(Boolean);
  if(!items.length)return'';
  const q=[[5],[4,2],[5,3,2]][items.length-1];
  return `\n\nLIÊN KẾT VỚI CÁC LESSON TRƯỚC (để lesson này nối tiếp, không đứng riêng lẻ)\nNội dung trọng tâm của các lesson ngay trước (lesson gần nhất ở trên cùng):\n${items.map(o=>'- '+o.l.name+' ('+o.k+'): '+o.t).join('\n')}\nYêu cầu: khoảng 30% từ vựng và mẫu câu của lesson này là ôn lại từ danh sách trên (${items.map((o,i)=>q[i]+' mục từ “'+o.l.name+'”').join(', ')}), dùng trong ngữ cảnh mới, không chép lại nguyên câu cũ. Khoảng 70% còn lại là nội dung mới theo mục ĐỘ KHÓ.`}
function buildPrompt(name,topic,level,lang,tense,X){
  lang=lang||'Tiếng Anh';X=X||{lv:'',link:''};
  const A=TENSES[lang]||[],tz=!tense?'':tense==='Cả 3 thì'?`\n5. Thì ngữ pháp – cả 3 thì, theo thứ tự ưu tiên: ${A.join(' → ')}. Mục này thay thế số câu ở mục 2 và 3:\n- Mục ### 02 (câu chuyện): viết cùng một câu chuyện 3 lần liên tiếp, đúng thứ tự trên, mỗi lần 6–8 câu, giữ nguyên nhân vật và sự kiện, chỉ đổi thì (và từ chỉ thời gian cho hợp lý). Không thêm dòng tiêu đề hay ghi chú giữa các lần.\n- Mục ### 03 (hỏi đáp): thì “${A[0]}” 8–10 cặp hỏi – đáp; thì “${A[1]}” và thì “${A[2]}” mỗi thì chỉ 5–6 cặp (rút gọn vì nội dung đã quen). Cả câu hỏi lẫn câu trả lời mẫu dùng đúng thì của phần đó, nối liền nhau, không thêm tiêu đề.\n- Hội thoại (01) vẫn viết tự nhiên.`:`\n5. Thì ngữ pháp: câu chuyện (02) và hỏi đáp (03), cả câu hỏi lẫn câu trả lời mẫu, phải dùng chủ yếu thì “${tense}” của ${lang}. Hãy chọn tình huống để thì này xuất hiện tự nhiên và lặp lại nhiều lần. Hội thoại (01) vẫn viết tự nhiên.`;
  return `Bạn là giáo viên ${lang.toLowerCase()}, chuyên biên soạn giáo trình nghe – nói đuổi (shadowing). Hãy soạn giúp mình 1 lesson mới theo đúng khuôn mẫu dưới đây.

Lesson (tên lesson cũng chính là chủ đề của bài): ${name||'[điền tên lesson, ví dụ: Lesson 13 – Booking a Hotel]'}
Ngôn ngữ học: ${lang}
Trình độ: ${level}
${tense?'Thì (câu chuyện và hỏi đáp): '+(tense==='Cả 3 thì'?'cả 3 thì ('+A.join(' → ')+')':tense)+'\n':''}
YÊU CẦU NỘI DUNG
1. Hội thoại: 2 người, 10–12 lượt thoại, câu ngắn, tự nhiên, dùng từ vựng và mẫu câu chính của chủ đề.
2. Câu chuyện: 1 đoạn văn kể ngôi thứ ba, 6–8 câu, cùng chủ đề, dùng lại từ vựng của hội thoại.
3. Hỏi đáp: 8–10 câu hỏi về nội dung hội thoại và câu chuyện. Mỗi câu hỏi (kết thúc bằng dấu ?) được theo ngay sau bởi 1 câu trả lời mẫu đầy đủ (không kết thúc bằng dấu ?).
4. Mỗi dòng chỉ 1 câu. Không ghi tên người nói, không đánh số, không ký hiệu, không emoji, viết đúng chính tả vì app hiển thị script làm phụ đề.${tz}${X.lv}${X.link}

### 01
Câu ${lang} | Bản dịch tiếng Việt

AUDIO
Cần đúng 1 file âm thanh duy nhất (mp3) chứa cả 3 phần nối tiếp nhau theo thứ tự: 01 Hội thoại → 02 Câu chuyện → 03 Hỏi đáp. Đặt tên file: "00 - Full.mp3".
Quy tắc:
- Đọc ở tốc độ bản xứ bình thường (app tự làm chậm khi cần nên không cần tạo bản chậm).
- Đọc đúng thứ tự và đúng nội dung từng dòng trong script (chỉ 3 phần 01–03, không đọc phần ### VOCAB); không thêm lời dẫn, tên phần, nhạc nền hay tên người nói.
- Giữa 2 câu liền nhau trong cùng 1 phần: chèn khoảng lặng khoảng 1 giây (app dựa vào khoảng lặng này để chia câu).
- Giữa 2 phần (sau hội thoại và sau câu chuyện): chèn khoảng lặng hoàn toàn im lặng dài khoảng 6 giây (app dựa vào đây để tự tách file thành 3 phần). Tuyệt đối không để khoảng lặng dài từ 3 giây trở lên ở bất kỳ chỗ nào khác.
- Hội thoại dùng 2 giọng khác nhau. Hỏi đáp đọc lần lượt từng câu hỏi rồi câu trả lời mẫu.
Nếu bạn tạo được file audio thì tạo luôn và gửi link tải. Nếu không, hãy: (1) đưa văn bản sẵn sàng dán vào công cụ text-to-speech, mỗi câu 1 dòng, giữa 2 phần chèn đúng 1 dòng [PAUSE 6s] để mình thay bằng thẻ ngắt nghỉ của công cụ (ví dụ <break time="6s"/>); (2) hướng dẫn từng bước dùng một công cụ TTS miễn phí có hỗ trợ ngắt nghỉ để xuất ra 1 file mp3 duy nhất.`}

const TENSES={'Tiếng Anh':['Hiện tại đơn (Present Simple)','Quá khứ đơn (Past Simple)','Tương lai đơn (will)'],
'Tiếng Pháp':['Présent','Passé composé','Futur proche'],

function npLg(){const e=document.getElementById('npG');if(!e)return'Tiếng Anh';if(e.value=='__other')return((document.getElementById('npGo')||{}).value||'').trim();return e.value||'Tiếng Anh'}

function npUpd(){const v=id=>(document.getElementById(id)||{}).value||'';const p=document.getElementById('npP');

async function npCopy(){const x=document.getElementById('npP');if(!x)return;

  catch(e){x.removeAttribute('readonly');x.select();x.setSelectionRange(0,x.value.length);let ok=false;try{ok=document.execCommand('copy')}catch(_){}

  let ks=[];if(txt.trim()){const m=parseScript(txt,1);ks=Object.keys(m).sort();ks.forEach(t=>{l.ov[t]=m[t].map(a=>({en:a.en,vi:a.vi}));l.s[t]=l.ov[t].map(a=>({en:a.en,vi:a.vi}));clearTrack(l,t)});const vc=parseVocab(txt);if(vc.length)l.voc=vc}
  persist();closeModal();render();

async function delCustom(id){const l=lesson(id);if(!l||!confirm('Xóa hẳn lesson này cùng audio, script và tiến độ?'))return;
  for(let t=1;t<=NAME.length;t++)await del(id+':'+t);
  L=L.filter(x=>x.id!=id);delete P[id];delete LAST[id];
  [SC,FIX,AN].forEach(o=>Object.keys(o).forEach(k=>{if(k.startsWith(id+':'))delete o[k]}));
  persist();sv('el2_prog',P);sv('el2_sc',SC);sv('el2_fix',FIX);sv('el2_ans',AN);sv('el2_last',LAST);render()}

function importPackObject(p){
 if(!p||p.format!=='listen-shadow-pack'||!Array.isArray(p.lessons)||!p.lessons.length)throw Error('File không đúng định dạng Listen & Shadow.');

 Object.keys(x.ov||{}).forEach(k=>{if(Array.isArray(x.ov[k]))ov[k]=x.ov[k].slice(0,500).map(a=>({en:String(a.en||'').slice(0,1000),vi:String(a.vi||'').slice(0,1000)}))});

  e.innerHTML=MG.items.map((x,i)=>`<div class="mgr" style="display:flex;align-items:center;gap:6px;margin:6px 0"><input type="checkbox" ${x.pick?'checked':''} onchange="MG.items[${i}].pick=this.checked" aria-label="Chọn lesson để sao chép" style="width:22px;height:22px;flex:none"><span class="mu" style="min-width:22px;text-align:right;flex:none">${i+1}</span><input type="text" value="${esc(x.name)}" maxlength="120" oninput="MG.items[${i}].name=this.value" aria-label="Tên lesson ${i+1}" style="flex:1;min-width:0"><button onclick="mgMove(${i},-1)" ${i?'':'disabled'} aria-label="Đưa lên" style="flex:none;padding:8px 12px">↑</button><button onclick="mgMove(${i},1)" ${i<MG.items.length-1?'':'disabled'} aria-label="Đưa xuống" style="flex:none;padding:8px 12px">↓</button></div>`).join('')}
function mgMove(i,d){const a=MG.items,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];mgDraw();
  const r=document.querySelectorAll('#mgL .mgr')[j];if(r){const b=r.querySelectorAll('button')[d<0?0:1];if(b&&!b.disabled)b.focus()}}
function mgSave(){const nm=MG.items.map(x=>({id:x.id,name:String(x.name||'').trim()}));
  if(nm.some(x=>!x.name)){toast('Tên lesson không được để trống.');return}
  nm.forEach(x=>{const l=lesson(x.id);if(!l)return;l.name=x.name.slice(0,120);if(l.built)LNM[l.id]=l.name});
  ORD[MG.sid]=nm.map(x=>x.id);sv('el2_order',ORD);sv('el2_lname',LNM);applyOrder();persist();closeModal();render();toast('Đã lưu thứ tự và tên lesson.')}
function mgCopy(){const ids=MG.items.filter(x=>x.pick).map(x=>x.id);if(!ids.length){toast('Hãy tick chọn ít nhất 1 lesson để sao chép.');return}openCopy(ids)}
function openCopy(ids){const l0=lesson(ids[0]);if(!l0)return;CP={ids,from:l0.set};
  const sets=allSets(),dflt=(sets.find(S=>S.id!=l0.set)||sets[0]).id;
  modal(`<h2>Sao chép ${ids.length>1?ids.length+' lesson':'lesson'}</h2><p class="mu">${ids.map(i=>esc((lesson(i)||{}).name||'')).join(' · ')}</p>
  <label class="mu">Sao chép vào bộ<select id="cpS">${sets.map(S=>`<option value="${esc(S.id)}"${S.id==dflt?' selected':''}>${esc(S.name)}${S.id==l0.set?' (bộ hiện tại, tạo bản sao)':''}</option>`).join('')}</select></label>
  <label class="mu" style="display:flex;align-items:center;gap:8px;margin-top:10px"><input type="checkbox" id="cpA" checked style="width:22px;height:22px;flex:none"> Kèm audio và mốc ngắt câu</label>
  <p class="mu">Bản sao độc lập với bản gốc, tiến độ học bắt đầu lại từ 0. Lesson được thêm vào cuối bộ đích.</p>
  <div class="row" style="margin-top:12px"><span class="sp"></span><button onclick="closeModal()">Hủy</button><button class="pri" id="cpGo" onclick="doCopy()">Sao chép</button></div>`)}
async function doCopy(){const sid=document.getElementById('cpS').value,wa=document.getElementById('cpA').checked,b=document.getElementById('cpGo');
  if(b){b.disabled=true;b.textContent='Đang sao chép…'}
  const same=sid==CP.from,cl=o=>o==null?o:JSON.parse(JSON.stringify(o));let n=0,au=0,miss=0;
  try{for(const id of CP.ids){const l=lesson(id);if(!l)continue;
    const nid=Math.max(0,...L.map(z=>Number(z.id)||0))+1,ov=cl(l.s)||{};
    const nl={id:nid,name:same?(l.name+' (bản sao)').slice(0,120):l.name,set:sid,custom:1,tr:{},has:{},ov,voc:cl(l.voc),s:cl(ov)};
    if(wa)for(const t of TK){if(!(l.has||{})[t])continue;const blob=await get(l.id+':'+t);if(!blob){miss++;continue}
      await put(nid+':'+t,blob);nl.has[t]=l.has[t];au++;const k=l.id+':'+t,k2=nid+':'+t;if(FIX[k])FIX[k2]=cl(FIX[k]);if(ADJ[k])ADJ[k2]=cl(ADJ[k])}
    L.push(nl);n++}
  }catch(e){toast('Sao chép bị lỗi: '+(e.message||e));if(b){b.disabled=false;b.textContent='Sao chép'}persist();sv('el2_fix',FIX);sv('el2_adj',ADJ);return}
  persist();sv('el2_fix',FIX);sv('el2_adj',ADJ);closeModal();render();
  const S=allSets().find(x=>x.id==sid);toast('Đã sao chép '+n+' lesson vào “'+(S?S.name:'')+'”'+(wa?' cùng '+au+' file audio':'')+(miss?' (thiếu '+miss+' file audio cục bộ)':'')+'.',8000)}

function openRename(){const sid=curSet(),S=allSets().find(x=>x.id==sid);if(!S)return;
  modal(`<h2>Đổi tên bộ giáo trình</h2><label class="mu">Tên bộ <input type="text" id="rnN" value="${esc(S.name)}" onkeydown="if(event.key=='Enter')renameSet('${S.id}')"></label>
  <div class="row" style="margin-top:12px"><span class="sp"></span><button onclick="closeModal()">Hủy</button><button class="pri" onclick="renameSet('${S.id}')">Lưu</button></div>`)}
function renameSet(id){const n=(document.getElementById('rnN').value||'').trim();if(!n){toast('Tên không được để trống.');return}
  if(id=='eb'){EBN=n;sv('el2_ebname',EBN)}else{const S=SETS.find(x=>x.id==id);if(S){S.name=n;sv('el2_sets',SETS)}}
  closeModal();render();toast('Đã đổi tên bộ.')}

function openAdd(id){const l=lesson(id),st=PLAN[V.day]&&PLAN[V.day][V.a],t=st?st.t:1,f=o=>TK.map((t,i)=>o(t)?'<b class="ok">✓ 0'+(i+1)+' '+NAME3[i]+'</b>':'✗ 0'+(i+1)+' '+NAME3[i]).join(' · ');
  modal(`<h2>Thêm vào ${esc(l.name)}</h2><div class="mu"><b>Audio</b> (✓ = đã nạp, ✗ = chưa có)<br>${f(k=>l.has[k])}</div><div class="mu" style="margin-top:8px"><b>Script</b> (✓ = đã có, ✗ = chưa có)<br>${f(k=>(l.s[k]||[]).length)}</div>
  <div class="row" style="margin-top:12px"><button class="pri" onclick="closeModal();pickAudio(${id})">+ Nạp audio</button><button class="pri" onclick="closeModal();openScript(${id},${t})">+ Nạp script</button></div>
  <div class="row" style="margin-top:6px"><button onclick="openCopy([${id}])">⧉ Sao chép sang bộ khác</button><button onclick="closeModal();delLesson(${id})">Xóa audio</button>${l.custom?`<button onclick="closeModal();delCustom(${id})">Xóa lesson</button>`:''}</div>
  <div class="row" style="margin-top:6px"><span class="sp"></span><button onclick="closeModal()">Đóng</button></div>`)}

async function migrate3(){
  if(ld('el2_mig3',0))return;
  const mv=(o,a,b)=>Object.keys(o).forEach(k=>{if(k==a||k.startsWith(a+':')){o[b+k.slice(a.length)]=o[k];delete o[k]}});
  for(const l of L)for(const[f,t]of[[2,1],[4,3]]){
    if(!(l.has||{})[f])continue;
    const b=await get(l.id+':'+f);
    if(b){await put(l.id+':'+t,b);l.has[t]=l.has[f];const A=l.id+':'+f,C=l.id+':'+t;
      [FIX,ADJ,SC,AN].forEach(o=>{Object.keys(o).forEach(k=>{if(k==C||k.startsWith(C+':'))delete o[k]});mv(o,A,C)})}
    await del(l.id+':'+f);delete l.has[f]}
  persist();sv('el2_fix',FIX);sv('el2_adj',ADJ);sv('el2_sc',SC);sv('el2_ans',AN);sv('el2_mig3',1)}
async function seedDefaults(){
  if(typeof DEFAULT_AUDIO==='undefined')return;
  let ch=0;
  for(const id of Object.keys(DEFAULT_AUDIO)){const l=lesson(+id);if(!l)continue;
    for(const t of Object.keys(DEFAULT_AUDIO[id])){
      if(l.has[t]&&await get(l.id+':'+t))continue;
      let r;try{r=await fetch(DEFAULT_AUDIO[id][t])}catch(e){continue}if(!r.ok)continue;
      await put(l.id+':'+t,new Blob([await r.arrayBuffer()],{type:'audio/mpeg'}));
      l.has[t]='0'+fnum(t)+' - '+tn(t)+' (Lesson_0'+id+').mp3';delete SG[l.id+':'+t];ch=1}}
  if(ch)persist()}
buildL();
idb().then(async()=>{try{await migrate3()}catch(e){}try{await seedDefaults()}catch(e){}expire();render()});
</script><script>
// ===== Cầu nối widget Android: gửi "ngày đang học" + tiến trình sang widget màn hình chính =====
(function(){
  function calc(){
    try{
      var sid='eb',best=0;
      for(var k in RS){if(RS[k]>best){best=RS[k];sid=k}}
      var LS=L.filter(function(l){return l.set==sid});
      if(!LS.length){sid='eb';LS=L.filter(function(l){return l.set=='eb'})}
      if(!LS.length)return null;
      var cur=null;
      for(var li=0;li<LS.length&&!cur;li++){var id=LS[li].id;
        if(!PLAN.slice(0,4).every(function(x,k){return x.every(function(_,j){return pr(id,k,j).d})}))cur=[li,firstDay(id)]}
      var allDone=false;
      if(!cur){cur=[LS.length-1,4];allDone=true}
      var l=LS[cur[0]],d=cur[1],steps=PLAN[d]||[],isRest=!steps.length;
      var st=steps.filter(function(_,j){return pr(l.id,d,j).d}).length;
      var days=PLAN.length-1,dayNo=cur[0]*PLAN.length+d+1;
      return {day:dayNo,dayInLesson:d+1,rest:isRest,done:st,total:steps.length,
        dayPct:isRest?(allDone?100:0):Math.round(st/steps.length*100),
        lesson:l.name,lessonPct:pct(l.id),allDone:allDone};
    }catch(e){return null}
  }
  var t=0;
  function push(){
    clearTimeout(t);
    t=setTimeout(function(){
      try{if(window.AndroidWidget){var o=calc();if(o)window.AndroidWidget.update(JSON.stringify(o))}}catch(e){}
    },400);
  }
  var r0=window.render;
  window.render=function(){var x=r0.apply(this,arguments);push();return x};
  var sp=window.setPr;
  window.setPr=function(){var x=sp.apply(this,arguments);push();return x};
  document.addEventListener('visibilitychange',function(){if(document.hidden){clearTimeout(t);try{var o=calc();if(o&&window.AndroidWidget)window.AndroidWidget.update(JSON.stringify(o))}catch(e){}}});
  push();
})();
</script>
