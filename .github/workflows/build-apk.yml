name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài thư viện
        run: npm install

      - name: Tạo project Android
        run: npx cap add android

      - name: Thêm widget + cầu nối
        run: python3 scripts/patch_android.py

      - name: Nhúng audio mặc định (www/audio)
        run: python3 scripts/embed_audio.py

      - name: Đồng bộ web vào Android
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ListenShadow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
